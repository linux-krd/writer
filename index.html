<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نویسه</title>
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/sahel-font@v3.4.0/dist/font-face.css" rel="stylesheet" type="text/css" />
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
<style>
:root{--font:'Vazirmatn',Tahoma,sans-serif;--fs:19px}
:root,html[data-th=white]{--bg:#fff;--side:#f6f6f7;--line:#e7e7ea;--ink:#1d1d1f;--mute:#8b8b93;--acc:#2bb592;--hl:#ece6ff;--hlink:#5b21b6;--tb:#1c1c1e;--btn:#222;--btnc:#fff}
html[data-th=black]{--bg:#121214;--side:#1b1b1e;--line:#2c2c30;--ink:#ececee;--mute:#8d8d95;--acc:#3ccfa8;--hl:#3a2f66;--hlink:#c9b8ff;--tb:#34343a;--btn:#ececee;--btnc:#121214}
html[data-th=straw]{--bg:#f6edcf;--side:#ecdfb5;--line:#dccc9a;--ink:#3a3019;--mute:#8c7d55;--acc:#a8821a;--hl:#e8d58c;--hlink:#5a4509;--tb:#3a3019;--btn:#3a3019;--btnc:#f6edcf}
html[data-th=olive]{--bg:#e9edd3;--side:#dce2bc;--line:#c8d09f;--ink:#2d3416;--mute:#6c7650;--acc:#6b8216;--hl:#cfd994;--hlink:#37470a;--tb:#2d3416;--btn:#2d3416;--btnc:#e9edd3}
*{box-sizing:border-box;scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
html,body{height:100%;margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);display:flex;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,select,input{font-family:inherit;color:inherit}
aside{width:270px;background:var(--side);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;gap:12px;transition:margin .2s}
body.focus aside{margin-inline-start:-270px}
.brand{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:22px;padding:0 4px}
.ib{background:none;border:0;cursor:pointer;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--mute)}
.ib:hover{background:var(--line)}
.new{background:var(--btn);color:var(--btnc);border:0;border-radius:6px;padding:10px;font-size:15px;cursor:pointer}
.stats{display:flex;align-items:center;gap:8px;background:var(--side);border-radius:16px;padding:5px 14px;font-size:13px;color:var(--ink);white-space:nowrap}.stats svg{flex:none}#saved{color:var(--mute);border-inline-start:1px solid var(--line);padding-inline-start:8px}
#list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:2px}
.it{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:6px;font-size:14px;cursor:pointer}
.it span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.it:hover,.it.on{background:var(--line)}
.it .x{opacity:0;border:0;background:none;cursor:pointer;color:var(--mute);font-size:16px}
.it:hover .x{opacity:1}
main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{flex-wrap:wrap;display:flex;align-items:center;gap:8px;padding:12px 18px;justify-content:space-between}
.grp{display:flex;gap:6px;align-items:center}
.seg{background:var(--side);border-radius:20px;padding:3px;display:flex}
.seg button,.pill{border:0;background:none;border-radius:16px;padding:5px 14px;font-size:13px;cursor:pointer;color:var(--mute)}
.seg button.on{background:var(--bg);color:var(--ink);box-shadow:0 1px 3px #0002}
.pill{background:var(--side);color:var(--ink)}
select.pill{appearance:none}
.sheet{flex:1;overflow:auto;padding:30px 24px 120px}
.page{max-width:680px;margin:0 auto}
#title{width:100%;border:0;outline:0;background:none;font-size:28px;font-weight:700;padding:0 0 10px}
#ed{outline:0;font-size:var(--fs);line-height:2.1;min-height:60vh;word-break:break-word}
#ed:empty:before{content:attr(data-ph);color:var(--mute)}
#ed h1{font-size:1.6em;line-height:1.6;margin:.6em 0 .2em}
#ed h3{font-size:1.12em;line-height:1.6;margin:.6em 0 .2em}
#ed ul,#ed ol{padding-inline-start:1.5em}
#ed h2{font-size:1.3em;line-height:1.6;margin:.6em 0 .2em}
#ed blockquote{margin:.5em 0;padding-inline-start:16px;border-inline-start:3px solid var(--acc);color:var(--mute)}
#ed a{color:var(--acc)}
#ed ::selection{background:var(--hl);color:var(--hlink)}
#tb .row{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:1px}#tb .row[hidden]{display:none}#tb input{background:#ffffff1f;border:0;outline:0;color:#fff;height:38px;width:220px;max-width:62vw;border-radius:9px;padding:0 10px;font-size:15px}#tb{max-width:calc(100vw - 16px);position:fixed;z-index:9;display:none;align-items:center;gap:2px;background:var(--tb);color:#fff;border-radius:14px;padding:6px 8px;box-shadow:0 8px 24px #0005;direction:ltr}
#tb.show{display:flex}
#tb button,#tb select{background:none;border:0;color:#fff;height:38px;min-width:36px;border-radius:9px;cursor:pointer;font-size:17px;position:relative}
#tb select{font-size:14px;padding:0 8px;appearance:none;direction:rtl}
#tb option{color:#000}
#tb button:hover,#tb button.on{background:#ffffff26}
#tb i{width:1px;height:24px;background:#ffffff33;margin:0 4px}
#tb button[data-tip]:hover:after{content:attr(data-tip);position:absolute;bottom:46px;left:50%;transform:translateX(-50%);background:var(--tb);padding:5px 12px;border-radius:8px;font-size:13px;white-space:nowrap}
.rel{position:relative}
.panel{max-height:calc(100vh - 70px);overflow:auto;position:absolute;top:46px;inset-inline-start:0;width:min(330px,92vw);background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 10px 30px #0003;z-index:20;display:flex;flex-direction:column;gap:14px}
.panel[hidden]{display:none}
.panel label{display:block;font-size:13px;color:var(--mute);margin-bottom:6px}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opts button{flex:1;min-width:64px;border:1px solid var(--line);background:var(--side);color:var(--ink);border-radius:10px;padding:8px 6px;cursor:pointer;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:5px}
.opts button.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.dot{width:20px;height:20px;border-radius:50%;border:1px solid #0003}
#ed sup.fnref{color:var(--acc);font-weight:700;cursor:pointer;padding:0 2px}
#ed ul,#ed ol{padding-inline-start:1.5em}
#fns{margin-top:48px;border-top:1px solid var(--line);padding-top:12px;font-size:calc(var(--fs)*.8)}
#fns[hidden]{display:none}
#fns h4{margin:0 0 6px;color:var(--mute);font-weight:600;font-size:1em}
#fns ol{margin:0;padding-inline-start:1.8em;line-height:1.9}
#fns li{outline:0}
#fns li:empty:before{content:attr(data-ph);color:var(--mute)}
.new{display:flex;align-items:center;justify-content:center;gap:8px}.new svg{flex:none}.nf{display:grid;place-items:center}
.hr{border:0;border-top:1px solid var(--line);margin:0}.sg{display:grid;grid-template-columns:1fr auto;gap:6px 14px;font-size:13px}.sg span:nth-child(odd){color:var(--mute)}.sg span:nth-child(even){font-weight:600}
.fi{display:grid;place-items:center;flex:none}
.acts{display:flex;gap:6px}
#tb .sw{height:28px;width:28px;min-width:0;margin:5px 3px;border-radius:50%;border:2px solid #fff6}
#tb .sw.none{background:linear-gradient(135deg,transparent 44%,#e5484d 44% 56%,transparent 56%)}
#ed{-webkit-print-color-adjust:exact;print-color-adjust:exact}.acts .new{flex:1}
.nf{min-width:48px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;cursor:pointer;font-size:14px}
.fh{display:flex;align-items:center;gap:4px;padding:7px 8px;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;margin-top:2px}
.fh:hover{background:var(--line)}
.fh .n{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.fh input{flex:1;min-width:0;border:1px solid var(--acc);border-radius:5px;background:var(--bg);padding:3px 6px;font-size:14px;outline:0}
.a{opacity:0;border:0;background:none;cursor:pointer;color:var(--mute);font-size:14px;padding:2px 3px}
.it:hover .a,.fh:hover .a{opacity:1}
@media(hover:none){.a{opacity:.8}}
.inner{padding-inline-start:14px;display:flex;flex-direction:column;gap:2px}
.sec-h{font-size:12px;color:var(--mute);padding:10px 8px 2px}
#mvm{position:fixed;z-index:30;background:var(--bg);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px #0003;padding:4px;min-width:170px;max-height:50vh;overflow:auto}
#mvm button{display:block;width:100%;text-align:start;border:0;background:none;color:var(--ink);padding:8px 10px;border-radius:6px;cursor:pointer;font-size:14px}
#mvm button:hover{background:var(--side)}#mvm button.on{color:var(--acc)}
html[dir=ltr]{--d:-1}html{--d:1}
@media(max-width:760px){aside{position:fixed;inset-block:0;inset-inline-start:0;z-index:8;width:80%;max-width:300px;box-shadow:0 0 30px #0004}body.focus aside{margin-inline-start:0;transform:translateX(calc(100% * var(--d)))}}
@media print{@page{margin:20mm}html[data-th]{--bg:#fff;--ink:#000;--mute:#555;--line:#ccc;--acc:#0b5cad;--hl:#fff;--hlink:#000}aside,.top,#tb{display:none!important}body,.sheet{display:block;overflow:visible;padding:0;background:#fff}#title{font-size:26px}#ed{font-size:14pt;line-height:2;-webkit-print-color-adjust:exact;print-color-adjust:exact}#fns{font-size:11pt}}

/* Cloud account panel */
.cloud-box{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
.cloud-box button{border:0;border-radius:8px;padding:9px 10px;background:var(--btn);color:var(--btnc);font:inherit;cursor:pointer}
.cloud-box button.secondary{background:var(--side);color:var(--ink);border:1px solid var(--line)}
.cloud-box .cloud-muted{font-size:12px;color:var(--mute);line-height:1.7;overflow-wrap:anywhere}
.cloud-box .cloud-actions{display:flex;gap:6px;flex-wrap:wrap}.cloud-box .cloud-actions button{flex:1;min-width:100px}
.cloud-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#999;margin-inline-end:6px}
.cloud-dot.ok{background:#2bb592}.cloud-dot.wait{background:#d9a400}.cloud-dot.err{background:#e5484d}
</style>
</head>
<body>
<aside>
  <div class="brand" data-i="brand"></div>
  <div class="acts"><button class="new" id="new"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 3.5H8A5 5 0 0 0 3 8.5v7a5 5 0 0 0 5 5h8a5 5 0 0 0 5-5V12"/><path d="M9.2 14.6l.7-3 7.2-7.2a1.6 1.6 0 0 1 2.2 0l.1.1a1.6 1.6 0 0 1 0 2.2l-7.2 7.2z"/></svg><span data-i="new"></span></button><button class="nf" id="nf" data-t="nf"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke-linecap="round" stroke-linejoin="round"><path stroke="var(--mute)" stroke-width="1.8" d="M3.5 17V7.5a2 2 0 0 1 2-2h3.2l2 2.2h5.3a2 2 0 0 1 2 2V12M3.5 17a2 2 0 0 0 2 2H11"/><path stroke="currentColor" stroke-width="2.4" d="M17.5 15v6M14.5 18h6"/></svg></button></div>
  <section class="cloud-box" aria-label="حساب و همگام‌سازی">
    <div style="font-weight:700;font-size:14px">حساب و فضای ابری</div>
    <div class="cloud-muted" id="cloud-user"><span class="cloud-dot"></span>وارد نشده‌اید</div>
    <button id="cloud-login">ورود با گوگل</button>
    <div class="cloud-actions">
      <button class="secondary" id="drive-connect" disabled>اتصال Google Drive</button>
      <button class="secondary" id="cloud-sync" disabled>همگام‌سازی</button>
    </div>
    <button class="secondary" id="cloud-logout" hidden>خروج از حساب</button>
    <div class="cloud-muted" id="cloud-status" aria-live="polite">اطلاعات فعلاً فقط روی همین دستگاه ذخیره می‌شوند.</div>
  </section>
  <div id="list"></div>
</aside>
<main>
  <div class="top">
    <div class="grp rel">
      <button class="ib" id="gear" data-t="settings" ><svg viewBox="0 0 24 24" width="24" height="24" stroke-linejoin="round"><path fill="var(--mute)" fill-opacity=".4" stroke="var(--mute)" stroke-opacity=".4" stroke-width="1" d="M10.37 1.73L13.63 1.73L14.15 4.50L15.78 5.18L18.11 3.59L20.41 5.89L18.82 8.22L19.50 9.85L22.27 10.37L22.27 13.63L19.50 14.15L18.82 15.78L20.41 18.11L18.11 20.41L15.78 18.82L14.15 19.50L13.63 22.27L10.37 22.27L9.85 19.50L8.22 18.82L5.89 20.41L3.59 18.11L5.18 15.78L4.50 14.15L1.73 13.63L1.73 10.37L4.50 9.85L5.18 8.22L3.59 5.89L5.89 3.59L8.22 5.18L9.85 4.50Z"/><circle cx="12" cy="12" r="3.3" fill="var(--ink)"/></svg></button>
      <button class="ib" id="sbtn" data-t="stt"><svg viewBox="0 0 24 24" width="22" height="22"><path fill="var(--mute)" fill-opacity=".55" d="M12 2.2c4.2 3.1 6.6 6.4 6.6 10.3a6.6 6.6 0 0 1-13.2 0c0-3.9 2.4-7.2 6.6-10.3z"/><path fill="var(--ink)" fill-opacity=".75" d="M12 6.8c2.3 2 3.6 3.9 3.6 6.1a3.6 3.6 0 0 1-7.2 0c0-2.2 1.3-4.1 3.6-6.1z"/><circle cx="12" cy="12.6" r="1.1" fill="var(--bg)"/><path d="M12 13.4v6" stroke="var(--bg)" stroke-width="1.1"/><path d="M12 19.5v2.6" stroke="var(--ink)" stroke-opacity=".75" stroke-width="1.6"/></svg></button>
      <div class="panel" id="panel" hidden>
        <div><label data-i="theme"></label><div class="opts">
          <button data-theme="straw"><span class="dot" style="background:#f6edcf"></span><span data-i="th_straw"></span></button>
          <button data-theme="black"><span class="dot" style="background:#121214"></span><span data-i="th_black"></span></button>
          <button data-theme="white"><span class="dot" style="background:#fff"></span><span data-i="th_white"></span></button>
          <button data-theme="olive"><span class="dot" style="background:#9aab4a"></span><span data-i="th_olive"></span></button>
        </div></div>
        <div><label data-i="font"></label><div class="opts">
          <button data-f="Vazirmatn" style="font-family:Vazirmatn">وزیرمتن</button>
          <button data-f="Sahel" style="font-family:Sahel">ساحل</button>
        </div></div>
        <div><label data-i="size"></label><div class="opts">
          <button data-s="17" data-i="s1"></button><button data-s="19" data-i="s2"></button><button data-s="22" data-i="s3"></button>
        </div></div>
        <div><label data-i="lang"></label><div class="opts">
          <button data-l="fa">فارسی</button><button data-l="ckb">کوردی</button><button data-l="en">English</button>
        </div></div>
      </div>
      <div class="panel" id="spanel" hidden><div><label data-i="stt"></label><div class="sg" id="sg"></div></div></div>
    </div>
    <div class="stats"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M5.3 15.6c1.6.9 4 1.2 5.3.3 1.4-.9 1.4-2.4 2.7-3.5 1.1-.9 3.4-1.2 5.4-2.3V4.4C11 5.2 6.4 9 5.3 15.6z" fill="var(--mute)" fill-opacity=".35" stroke="none"/><path d="M5 20.5C4.8 13 8 5.6 18.7 4.3" stroke="var(--acc)" stroke-width="2"/></svg><span id="wc"></span><span id="saved" data-i="saved"></span></div>
    <div class="grp"><div class="seg"><button id="wr" class="on" data-i="wr"></button><button id="fo" data-i="fo"></button></div>
      <button class="pill" id="pdf" data-i="pdf"></button></div>
  </div>
  <div class="sheet"><div class="page">
    <input id="title" autocomplete="off">
    <div id="ed" contenteditable="true"></div>
    <div id="fns" hidden><h4 data-i="fnh"></h4><ol id="fnl"></ol></div>
  </div></div>
</main>
<div id="tb">
  <div class="row" id="main-row">
    <button data-b="p" data-t="t_p">¶</button>
    <button data-b="h1" data-t="t_h1">H1</button>
    <button data-b="h2" data-t="t_h2">H2</button>
    <button data-b="h3" data-t="t_h3">H3</button>
    <button data-b="blockquote" data-t="t_q">❝</button><i></i>
    <button data-c="bold" data-t="t_b"><b>B</b></button>
    <button data-c="italic" data-t="t_i"><em>I</em></button>
    <button data-c="underline" data-t="t_u"><u>U</u></button>
    <button data-c="strikeThrough" data-t="t_s"><s>S</s></button>
    <button data-c="subscript" data-t="t_sub">x<sub>2</sub></button>
    <button data-c="superscript" data-t="t_sup">x<sup>2</sup></button><i></i>
    <button id="cb" data-t="t_col"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M7 15.5L12 4l5 11.5M8.7 11.8h6.6" stroke="currentColor" stroke-width="2"/><rect id="cbar" x="4" y="18.3" width="16" height="3" rx="1.5" fill="#e5484d" stroke="none"/></svg></button>
    <button id="hb" data-t="t_hl"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M14.6 3.8l5.6 5.6-8.4 8.4H7.2v-5.6z" stroke="currentColor" stroke-width="1.9"/><rect id="hbar" x="4" y="19.3" width="16" height="2.6" rx="1.3" fill="#f5c518" stroke="none"/></svg></button><i></i>
    <button data-c="insertUnorderedList" data-t="t_ul">•≡</button>
    <button data-c="insertOrderedList" data-t="t_ol">1≡</button>
    <button id="fnb" data-t="t_fn">¹</button>
    <button id="lkb" data-t="t_link">🔗</button>
  </div>
  <div class="row" id="col-row" hidden></div>
  <div class="row" id="lk-row" hidden>
    <input id="lk" type="url" inputmode="url" placeholder="https://example.com" dir="ltr">
    <button id="lk-ok" data-t="t_ok">✓</button>
    <button id="lk-x" data-t="t_x">✕</button>
  </div>
</div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],ed=$('#ed'),tb=$('#tb');

let linking=false,saved=null;
const lkRow=$('#lk-row'),mainRow=$('#main-row');
function place(){if(linking)return;const s=getSelection();if(!s.rangeCount||s.isCollapsed||!ed.contains(s.anchorNode)){tb.classList.remove('show');const cr=$('#col-row');if(!cr.hidden){cr.hidden=true;mainRow.hidden=false}return}
 const r=s.getRangeAt(0).getBoundingClientRect();tb.classList.add('show');const w=tb.offsetWidth;
 let x=r.left+r.width/2-w/2;x=Math.max(8,Math.min(x,innerWidth-w-8));let y=r.top-tb.offsetHeight-12;if(y<8)y=r.bottom+12;
 tb.style.left=x+'px';tb.style.top=y+'px';
 tb.querySelectorAll('[data-c]').forEach(b=>b.classList.toggle('on',document.queryCommandState(b.dataset.c)));
 const f=(document.queryCommandValue('formatBlock')||'p').toLowerCase().replace(/[<>]/g,'');
 tb.querySelectorAll('[data-b]').forEach(b=>b.classList.toggle('on',b.dataset.b===(['h1','h2','h3','blockquote'].includes(f)?f:'p')))}
document.addEventListener('selectionchange',()=>setTimeout(place,10));

tb.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{document.execCommand(b.dataset.c);touch();place()});
tb.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{const k=b.dataset.b,on=b.classList.contains('on');ed.focus();document.execCommand('formatBlock',false,'<'+(on?'p':k)+'>');touch();place()});
function normUrl(u){u=u.trim();if(!u)return'';return /^(https?:|mailto:|tel:)/i.test(u)?u:'https://'+u}
function endLink(){linking=false;lkRow.hidden=true;mainRow.hidden=false;if(saved){const s=getSelection();s.removeAllRanges();s.addRange(saved)}ed.focus();setTimeout(place,10)}
$('#lkb').onclick=()=>{const s=getSelection();if(!s.rangeCount)return;saved=s.getRangeAt(0).cloneRange();
 const n=s.anchorNode,a=n&&(n.nodeType==1?n:n.parentElement).closest('a');
 linking=true;mainRow.hidden=true;lkRow.hidden=false;$('#lk').value=a?a.getAttribute('href'):'';setTimeout(()=>$('#lk').focus(),30)};
function okLink(){const u=normUrl($('#lk').value);const rg=saved;linking=false;lkRow.hidden=true;mainRow.hidden=false;ed.focus();
 const s=getSelection();s.removeAllRanges();s.addRange(rg);
 if(u){document.execCommand('createLink',false,u);ed.querySelectorAll('a').forEach(a=>{a.target='_blank';a.rel='noopener'})}else document.execCommand('unlink');
 touch();setTimeout(place,10)}
$('#lk-ok').onclick=okLink;$('#lk-x').onclick=endLink;
$('#lk').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();okLink()}else if(e.key==='Escape')endLink()};
